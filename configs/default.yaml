# Default configuration for the Predictive AI Evaluation Challenge
# A100-oriented k-factor / residual ablation pipeline.
#
# Everything in this file is overridable from the notebook by editing the
# loaded dict before passing it to the training entry points.

seed: 0
allow_cpu: false                 # if true, falls through when no GPU present

# ----------------------------------------------------------------------------
# Data
# ----------------------------------------------------------------------------
data:
  # Hugging Face dataset repo (loaded via huggingface_hub.snapshot_download
  # and the per-benchmark parquet pattern documented in the starter kit).
  hf_repo_id: "aims-foundations/measurement-db"
  # Local cache for parquet downloads (relative to the project root).
  local_data_dir: "artifacts/data"
  # Optional whitelist of benchmark response tables. null = load all.
  benchmarks: null
  # Cap rows per benchmark for fast iteration. null = use everything.
  max_rows_per_benchmark: null
  # Drop rows whose response field is null.
  drop_nan_labels: true
  # Binarize labels >= this threshold to 1, else 0. Soft labels stay soft.
  binarize_threshold: 0.5
  # Whether to keep soft labels in [0, 1] (true) or hard-binarize (false).
  keep_soft_labels: true
  # Minimum observations per subject / item to retain.
  min_subject_obs: 3
  min_item_obs: 1

# ----------------------------------------------------------------------------
# Validation splits
# ----------------------------------------------------------------------------
splits:
  primary: "item_cold_start"     # primary metric uses this split
  val_fraction: 0.10
  holdout_benchmarks: []         # for benchmark_heldout split
  enable_random_row_debug: true  # leaky split; reported separately

# ----------------------------------------------------------------------------
# Encoder (Hugging Face transformer for item / subject text)
# ----------------------------------------------------------------------------
encoder:
  # Default A100 encoder: Qwen3-Embedding-4B. Last-token pooled,
  # instruction-aware. Swap to a lighter model if memory is tight:
  #   sentence-transformers/all-mpnet-base-v2
  #   intfloat/e5-large-v2
  #   BAAI/bge-large-en-v1.5
  model_id: "Qwen/Qwen3-Embedding-4B"
  # max_length: optional hard cap. If null, the pipeline computes the 99th
  # percentile token length over the actual data, rounds up to a multiple
  # of 64, and persists the chosen value to meta.json for reproducibility.
  max_length: null
  max_length_floor: 256          # never go below this many tokens
  max_length_ceiling: 4096       # never go above this many tokens
  batch_size: 64                 # A100 40GB, Qwen3-Embedding-4B, bf16
  batch_size_fallback: 16        # used after OOM-retry halves itself out
  # Per-batch size used by the *runtime* (Codabench, typically L4 24 GB)
  # inside the batched-flush path -- distinct from the offline training
  # batch above. Default 16 because the runtime co-resident judge model
  # (Qwen3-4B-Instruct, bf16) eats ~10 GB of activations + weights.
  runtime_batch_size: 16
  bf16: true
  # Try Flash Attention 2 first, fall back to SDPA if the wheel is missing.
  use_flash_attention: true
  pooling: "last_token"          # mean | cls | last_token (Qwen3 needs last_token)
  # Add the e5 / instruct prefix when required by the encoder.
  query_prefix: ""               # set to "query: " for e5 models if desired
  passage_prefix: ""             # set to "passage: " for e5 models if desired
  # Qwen3-Embedding accepts an instruction prefix. Automatically applied
  # to both query and passage texts when the model id matches "Qwen3-Embedding".
  qwen3_instruction: "Represent this AI evaluation context for difficulty prediction"
  # If true, use contextual item text "Benchmark: .. Condition: .. Item: ..".
  use_contextual_item_text: true
  cache_dir: "artifacts/embeddings"
  trust_remote_code: false
  # Skip the encoder entirely (debug only): use random unit vectors.
  use_random_embeddings: false
  random_embedding_dim: 256

# ----------------------------------------------------------------------------
# Google Drive cache (Colab-only persistence of the encoded embedding cache)
# ----------------------------------------------------------------------------
drive_cache:
  enabled: true                  # Colab default: persist encoder cache across sessions
  folder: "/content/drive/MyDrive/prediction-competition-321M/embeddings"
  upload_on_completion: true     # push after encoding finishes
  download_on_start: true        # pull before checking local cache

# ----------------------------------------------------------------------------
# Submission-bundled training-item cache (int8 + optional PCA + FAISS)
# Used at test time for nearest-neighbor lookup over training items.
# ----------------------------------------------------------------------------
submission_cache:
  enabled: true
  quantize: "int8"               # int8 | fp16 | none
  pca_dim: 256                   # null = skip PCA; lower = smaller bundle
  include_faiss_index: true      # ship a FAISS HNSW index for fast lookup
  include_top_k_index: true      # alias for include_faiss_index (preferred)
  faiss_index_type: "HNSW32"     # HNSW32 | IVF | flat
  # Hard cap on the cache *directory* (submission/cache/) -- export fails
  # if exceeded. The final submission.zip is also capped, separately, by
  # submission.max_zip_size_mb below.
  max_bundle_size_mb: 70
  # Per-subject pass-rate aggregations bundled for runtime NN features.
  # "cluster" is always cheap (n_subjects * k_clusters floats). "sparse"
  # ships the full (subject, item) -> pass_rate CSR matrix; only safe when
  # the training matrix is genuinely sparse.
  passrate_format: "sparse"      # cluster | sparse | none
  # Runtime NN feature computation: top-K used by the compressed cache.
  # Should match the training-time k by default. Drop it only if the
  # bundle is tight on size budget.
  runtime_k: 16

# ----------------------------------------------------------------------------
# Nearest-neighbor features (full-fidelity index used at training + eval time)
# These eight scalars per (subject, item) prediction summarize the subject's
# performance on the top-K nearest training items. They feed *into* the
# residual MLP alongside pool, cluster, and judge channels.
# ----------------------------------------------------------------------------
nn_features:
  enabled: true
  k: 16
  similarity: "cosine"
  exclude_self_in_training: true
  cache_dir: "artifacts/nn_features"
  # Fallback values when no labeled neighbor is found. The model learns to
  # down-weight the NN aggregate via the `coverage` / `n_labeled_neighbors`
  # features when these fallbacks fire.
  fallback_value: 0.0
  top1_missing_sentinel: -1.0

# ----------------------------------------------------------------------------
# Pool features (hand-engineered per-item scalars, fed *into* the MLP)
# ----------------------------------------------------------------------------
item_features:
  enabled: true
  use_pool: true                 # concat z-scored pool features into MLP input
  use_clusters: true             # concat learned cluster embedding into MLP input
  pool_feature_dim: 9            # update if the pool-feature list changes
  cluster_embed_dim: 16
  cache_dir: "artifacts/item_features"

# ----------------------------------------------------------------------------
# Clustering (k-means on cached item embeddings, fed *into* the MLP)
# ----------------------------------------------------------------------------
clustering:
  k: 64
  seed: 0
  centroids_path: "artifacts/cluster_centroids.npy"
  assignments_path: "artifacts/item_clusters.parquet"
  # Backend: "auto" (FAISS GPU when available, else sklearn CPU), "faiss_gpu"
  # (require GPU, fail loudly if missing), or "sklearn" (force CPU fallback).
  # FAISS GPU is ~50-100x faster than sklearn on the full corpus on an A100.
  backend: "auto"
  # FAISS k-means knobs (ignored by the sklearn path). For closest-to-old
  # behavior, use niter=100, nredo=4; the defaults below are tuned for speed.
  faiss_niter: 50
  faiss_nredo: 1
  faiss_assign_batch: 65536
  # Cap on points/centroid FAISS uses during training. null = FAISS default
  # (256). Raise to ~1024 on large corpora so centroids reflect the full
  # distribution instead of FAISS's internal subsample (~4x slower fit).
  faiss_max_points_per_centroid: null
  gpu_id: 0
  overwrite: false

# ----------------------------------------------------------------------------
# Models / training
# ----------------------------------------------------------------------------
train:
  # Default scoped to a single fast variant for iteration speed.
  # The full ablation grid (all six variants, multiple ks/seeds) is
  # re-enabled by editing this list + flipping
  # ``RUN_FEATURE_TOGGLE_GRID = True`` in notebook cell 13.
  models:
    - kfactor_irt_item_gated_mlp
  # Hyperparameters
  k_factors: [16]                # scoped: single k for fast iteration
  item_map_hidden_dim: 512
  residual_hidden_dim: 256
  dropout: 0.1
  weight_decay: 1.0e-4
  learning_rate: 3.0e-3
  # A100 large-batch defaults. With batch_size=65536 the effective LR is
  # already large; use shorter training (5 epochs by default).
  batch_size: 65536
  epochs: 5
  warmup_steps: 30
  num_workers: 0
  lambda_resid_init: 0.1
  lambda_resid_trainable: true
  freeze_embeddings: true
  seeds: [0]                     # scoped: single seed for fast iteration
  early_stopping_patience: 5
  grad_clip: 1.0
  scheduler: "cosine"            # cosine | linear | none
  # Soft regularization on the Item-IRT heads: prevents beta from exploding
  # and keeps log(alpha) close to zero so the IRT head and the residual MLP
  # don't collude in degenerate ways.
  irt_reg:
    lambda_beta: 1.0e-4
    lambda_alpha: 1.0e-4

# ----------------------------------------------------------------------------
# LoRA fine-tuning of the item-side encoder (optional, opt-in)
#
# When ``enabled: true`` the pipeline runs an overnight-safe second training
# pass that unfreezes the encoder via PEFT LoRA adapters in the attention
# projections, and trains them jointly with the existing head. The encoder
# embedding cache is not used by this loop -- every step forwards raw item
# tokens through the adapter-augmented encoder -- but the judge / NN /
# cluster / pool features remain frozen inputs (they were computed against
# the original frozen embeddings on purpose).
#
# Subjects stay cached lookups. We only LoRA-affect items.
#
# Step-level checkpointing to Drive: a Colab disconnect can cost at most
# ``checkpoint_every_steps`` of work. Validate the first eval (step 1000 by
# default) before trusting the run overnight -- if item-cold-start NLL has
# regressed from the base checkpoint, kill and lower ``encoder_lr``.
# ----------------------------------------------------------------------------
lora:
  enabled: false                       # master switch; false = current behavior
  # Path to the head-only checkpoint to initialize from. ``null`` =
  # auto-pick the best run by item-cold-start val log-loss from the current
  # ``ALL_RUNS`` table (typically kfactor_irt_item_gated_mlp_k16_seed0_full).
  base_checkpoint: null
  # Adapter geometry. r=16 is the standard "moderate" rank; alpha/r=2 is the
  # PEFT default scaling. Target the attention projections (q/k/v/o) which
  # together carry the bulk of the encoder's expressive power.
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  # null = transform all layers; or e.g. [14,15,...,35] for late layers only.
  # Restricting to late layers is a memory / overfitting escape valve.
  layers_to_transform: null
  gradient_checkpointing: true
  # Two-group optimizer: encoder LR is ~100x smaller because the adapters
  # are training from scratch but the head is already trained and should
  # fine-tune gently around its optimum.
  encoder_lr: 5.0e-6
  head_lr: 5.0e-4
  weight_decay_head: 0.01
  epochs: 1
  # Item-batch size at the *raw text* level. Effective item batch =
  # batch_size_items * grad_accum_steps. Encoder fwd/bwd dominates GPU
  # memory; halve and double respectively if it OOMs.
  batch_size_items: 8
  grad_accum_steps: 4
  max_length: 1024
  warmup_steps: 50
  bf16: true
  # Optional: cap optimizer state for the LoRA encoder via 8-bit AdamW
  # (bitsandbytes). Default false; flip on if optimizer memory is tight.
  use_8bit_optimizer: false
  # ---- Overnight safety -------------------------------------------------
  # Atomically save adapter + head + optimizer + RNG state to Drive every
  # N steps. A Colab disconnect should cost no more than N steps of work.
  checkpoint_every_steps: 200
  # Run item-cold-start validation every N steps. Validation forwards val
  # items through the CURRENT adapter state, not cached frozen embeddings.
  eval_every_steps: 1000
  drive_checkpoint_dir: "/content/drive/MyDrive/prediction-competition-321M/lora_ckpt"
  keep_last_n_checkpoints: 3
  resume: true                         # auto-resume from latest Drive checkpoint
  # Hard runtime ceiling. We force a checkpoint and exit cleanly before
  # exceeding this, so re-running the cell after a disconnect picks up
  # where it left off. Set to 0 to disable the cap.
  max_runtime_minutes: 600
  # Verify step-0 val NLL matches the base checkpoint within ``init_check_tol``.
  # Adapters initialize to zero contribution (PEFT default), so the assertion
  # is a structural wiring check, not a tolerance knob you should loosen.
  init_check_tol: 1.0e-3
  # Per-step microbatch for the val pass. Smaller than the train item batch
  # because val also forwards through the encoder (no cache).
  val_batch_size_items: 16
  # OOM-resilient fallback. If the train forward OOMs at the configured
  # ``batch_size_items``, halve and double ``grad_accum_steps`` once
  # automatically before giving up.
  oom_fallback: true
  # ---- Submission export ------------------------------------------------
  # ``adapter_only`` (default): ship the tiny LoRA adapter inside the
  #   submission ZIP and apply it to the stock encoder at runtime. Adds a
  #   ``peft`` runtime dependency but the bundle stays self-contained.
  # ``hf_upload``: merge adapter into a private HF repo and reference that
  #   repo from ``models.txt``. Requires a writable HF token.
  export_mode: "adapter_only"
  # HF repo id to push the merged encoder to when ``export_mode = "hf_upload"``.
  # Ignored otherwise. ``{user}`` is replaced with the resolved HF username.
  hf_upload_repo: "{user}/qwen3-embedding-4b-lora-merged"

# ----------------------------------------------------------------------------
# LLM-as-judge (local HF model that scores P(correct) per (subject, item))
# Outputs four scalar features fed *into* the residual MLP:
#   [lp_yes, lp_no, lp_yes - lp_no, p_yes_renormalized]
# Cache the scores once per (subject_key, item_key) pair; never re-score.
# IMPORTANT: do not change `model_id` or the prompt template casually -- any
# change invalidates the on-disk cache (the `prompt_version` hash covers
# template + token list, model_id covers tokenizer + weights).
# ----------------------------------------------------------------------------
judge:
  enabled: true
  model_id: "Qwen/Qwen3-4B-Instruct-2507"
  # Default tuned for a single A100 (40/80 GB) with Qwen3-4B in bf16 + FA2
  # at max_prompt_tokens=1024. Drop to 16 on T4 / smaller GPUs. The forward
  # uses use_cache=False so no KV cache is allocated -- only activations.
  batch_size: 256
  # *Runtime* (Codabench) batch size for the inline judge. Read separately
  # from ``batch_size`` above because Codabench typically lands on L4
  # (24 GB), where bs=256 would OOM instantly. The batched-flush runtime
  # template in src/export_submission.py reads exactly this field via
  # ``judge.runtime_batch_size`` in the shipped runtime_meta.json.
  runtime_batch_size: 16
  max_prompt_tokens: 512
  max_new_tokens: 1
  bf16: true
  use_flash_attention: true
  trust_remote_code: false
  cache_dir: "artifacts/judge"
  # ---- Parallelism / throughput (A100-friendly) ----------------------------
  # Number of CPU threads doing prompt prep (template format + truncation
  # re-tokenize loop). HF fast tokenizers release the GIL during .encode so
  # threads parallelize without the per-process model-load cost of MP.
  # 0 = auto (min(8, os.cpu_count())). Set to 1 to disable CPU parallelism.
  num_workers: 4
  # Number of batches kept on the host-device boundary at all times. A
  # background thread pads + pins the next ``prefetch_batches`` while the
  # GPU is busy. 2 hides nearly all CPU latency for variable-length data.
  prefetch_batches: 4
  # Sort prompts by token length descending before batching so each batch
  # has near-uniform length. Slashes padding waste and is the single biggest
  # win for A100 throughput on heterogeneous item content.
  length_bucket: true
  # Allocate pinned host memory for prefetched batches so the H2D copy can
  # run asynchronously alongside the previous forward pass. Auto-disabled
  # when CUDA is unavailable.
  pin_memory: true
  # When true the residual MLP receives [lp_yes, lp_no, lp_diff, p_yes]
  # as additional inputs. Toggle off to ablate while keeping the cache.
  feature_in_residual: true
  # If true the export bundles the judge model id into models.txt and runs
  # the judge live at test time inside predict(). If false the export uses
  # the (cheaper) distillation fallback -- a judge-free head trained on
  # the judge-aware model's predictions.
  ship_at_runtime: true

# ----------------------------------------------------------------------------
# Drive cache for the LLM-as-judge scores parquet
# Mirrors the embedding drive cache; keyed by judge slug (model id + prompt
# version hash). Survives across Colab sessions.
# ----------------------------------------------------------------------------
judge_drive_cache:
  enabled: true
  folder: "/content/drive/MyDrive/prediction-competition-321M/judge"
  upload_on_completion: true
  download_on_start: true

# ----------------------------------------------------------------------------
# Evaluation / artifact paths
# ----------------------------------------------------------------------------
eval:
  results_path: "artifacts/results/results.csv"
  plots_dir: "artifacts/plots"
  checkpoints_dir: "artifacts/checkpoints"
  ece_bins: 10
  primary_metric: "log_loss"     # lower is better; selection done on item cold-start

# ----------------------------------------------------------------------------
# Submission export
# ----------------------------------------------------------------------------
submission:
  dir: "submission"
  zip_path: "submission.zip"
  declared_models_max: 5         # platform cap
  # Hard cap on the final submission.zip (the file the user uploads to
  # Codabench). Anything larger has historically failed the web-upload
  # widget. ``make_submission_zip`` deletes the over-cap zip and raises so
  # we never silently ship an un-uploadable bundle.
  max_zip_size_mb: 70
  # Ship the quantized training-item ``cache/`` (FAISS index, item
  # embeddings, subject pass-rate sparse matrices) inside the submission
  # zip. Default is FALSE because every 114 MB bundle we shipped with
  # cache/ failed PAIEC-UNKNOWN-001 within 1-5 minutes on Codabench
  # while the 15 MB slim bundle (no cache/) was the only one that ever
  # ran to completion. The runtime ``model.py`` gracefully falls back to
  # zero-valued NN features when the cache is absent
  # (``_get_nn_features`` returns ``np.zeros(dim)`` when
  # ``TRAINING_CACHE is None``), so flipping this off costs us the NN
  # feature signal but keeps the bundle inside the platform's
  # operational envelope. Flip to true ONLY after verifying the platform
  # accepts the larger bundle.
  ship_training_cache: false
  # Ship ``requirements.txt`` inside the submission zip. Default is
  # FALSE because the working slim bundle did not have one, and we
  # suspect the platform's ``pip install -r requirements.txt`` step
  # (specifically the optional ``faiss-cpu`` wheel) was the killer for
  # every bundle that included it. The platform pre-installs torch /
  # numpy / transformers / etc., so a missing requirements.txt is fine.
  ship_requirements_txt: false

# ----------------------------------------------------------------------------
# Optional GCS sync
# ----------------------------------------------------------------------------
gcs:
  bucket: null                   # set to "gs://your-bucket/path" to enable
  sync_artifacts: false
